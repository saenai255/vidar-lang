name: Build binaries and VS Code extension

# Every push to main is released as <epoch>-<year>-<month>-<day>-<short hash>, dated by the commit (UTC).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  EPOCH: "0"

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$EPOCH-$(TZ=UTC git log -1 --date=format-local:%Y-%m-%d --format=%cd)-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          # vidar:sched has stack-switching assembly for these three only
          - { os: macos-14, target: darwin-arm64 }
          - { os: ubuntu-24.04, target: linux-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
    runs-on: ${{ matrix.os }}
    env:
      VIDAR_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            editors/vscode/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix editors/vscode

      - name: Build binaries
        run: npm run build:binaries

      - name: Smoke test
        run: |
          bin/${{ matrix.target }}/vidar --version
          bin/${{ matrix.target }}/vidar emit tests/cases/closure_values/input.vidar > /dev/null

      # an extension version must be semver, so the release version goes in its prerelease part
      - name: Package extension
        working-directory: editors/vscode
        run: |
          npm pkg set version="0.0.0-$VIDAR_VERSION"
          npm run package
          mv ./*.vsix "vidar-vscode-$VIDAR_VERSION-${{ matrix.target }}.vsix"

      - uses: actions/upload-artifact@v4
        with:
          name: vidar-${{ matrix.target }}
          path: |
            bin/*.tar.gz
            editors/vscode/*.vsix
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        run: |
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "release $VERSION already exists"
            exit 0
          fi
          gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$VERSION" --generate-notes \
            dist/bin/*.tar.gz dist/editors/vscode/*.vsix
