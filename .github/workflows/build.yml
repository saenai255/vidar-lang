name: Build binaries and VS Code extension

# Every PR merged into main is released as <year>.<month>.<n>, n counting the month's releases (UTC).
# Tests run on the PR; the release after the merge does not run them again.
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

env:
  # the Odin release the tests build with (its `odin version` is dev-2026-07-nightly)
  ODIN_VERSION: dev-2026-07

# merges queue, so each release sees the previous one's tag
concurrency:
  group: ${{ (github.event.pull_request.merged && 'release') || format('pr-{0}', github.event.pull_request.number || github.run_id) }}
  cancel-in-progress: false

jobs:
  version:
    if: github.event.action != 'closed' || github.event.pull_request.merged
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0
      - id: v
        run: |
          month=$(date -u +%Y.%-m)
          n=$(git tag --list "$month.*" | wc -l)
          echo "version=$month.$((n + 1))" >> "$GITHUB_OUTPUT"

  test:
    if: github.event.action != 'closed'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

      # every test tool leaves its temp dirs in $TMPDIR, where the failure upload finds them
      - name: Use the runner's temp dir
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # vidar:sched's stack switching is a foreign .asm import, which Odin assembles with nasm
      - name: Install nasm
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y nasm

      - name: Install Odin
        run: |
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64) platform=linux-amd64 ;;
            Linux-ARM64) platform=linux-arm64 ;;
            macOS-ARM64) platform=macos-arm64 ;;
            macOS-X64) platform=macos-amd64 ;;
            *) echo "no Odin release for $RUNNER_OS-$RUNNER_ARCH"; exit 1 ;;
          esac
          mkdir -p "$RUNNER_TEMP/odin"
          curl -fsSL --retry 3 "https://github.com/odin-lang/Odin/releases/download/$ODIN_VERSION/odin-$platform-$ODIN_VERSION.tar.gz" \
            | tar xz -C "$RUNNER_TEMP/odin" --strip-components=1
          echo "$RUNNER_TEMP/odin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/odin/odin" version

      - name: Install dependencies
        run: npm ci

      # ols isn't installed: the LSP suite skips its forwarding checks
      - name: Test
        run: npm test

      - name: Test with goroutines on 4 threads
        env:
          VIDAR_ODIN_FLAGS: -define:VIDAR_THREADS=4
        run: node scripts/test.js

      - name: Stress the scheduler
        run: npm run stress -- tests/cases/sched_pending_io -n 500

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hangs-${{ matrix.os }}
          path: ${{ runner.temp }}/vidar-stress-*/hang-*.txt
          if-no-files-found: ignore

  build:
    needs: [version]
    strategy:
      fail-fast: false
      matrix:
        include:
          # vidar:sched has stack-switching assembly for these three only
          - { os: macos-14, target: darwin-arm64 }
          - { os: ubuntu-24.04, target: linux-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
    runs-on: ${{ matrix.os }}
    env:
      VIDAR_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            editors/vscode/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix editors/vscode

      - name: Build binaries
        run: npm run build:binaries

      - name: Smoke test
        run: |
          bin/${{ matrix.target }}/vidar --version
          bin/${{ matrix.target }}/vidar emit tests/cases/closure_values/input.vidar > /dev/null

      - name: Package extension
        working-directory: editors/vscode
        run: |
          npm pkg set version="$VIDAR_VERSION"
          npm run package
          mv ./*.vsix "vidar-vscode-$VIDAR_VERSION-${{ matrix.target }}.vsix"

      - uses: actions/upload-artifact@v4
        with:
          name: vidar-${{ matrix.target }}
          path: |
            bin/*.tar.gz
            editors/vscode/*.vsix
          if-no-files-found: error

  release:
    if: >-
      github.event.action == 'closed' && github.event.pull_request.merged
      && github.event.pull_request.base.ref == 'main'
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # notes from the conventional commit messages since the previous release
      - name: Write release notes
        run: |
          prev=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName // empty')
          if [ -n "$prev" ] && git rev-parse -q --verify "refs/tags/$prev" > /dev/null; then range=("$prev..$MERGE_SHA"); else range=(-1 "$MERGE_SHA"); fi
          git log --no-merges --format='%s (%h)' "${range[@]}" > commits.txt
          section() {
            lines=$( (grep -E "^$1(\([^)]*\))?!?: " commits.txt || true) | sed -E 's/^[a-z]+(\(([^)]*)\))?!?: /- **\2:** /; s/^- \*\*:\*\* /- /')
            if [ -n "$lines" ]; then printf '## %s\n\n%s\n\n' "$2" "$lines" >> notes.md; fi
          }
          : > notes.md
          breaking=$( (grep -E '^[a-z]+(\([^)]*\))?!: ' commits.txt || true) | sed 's/^/- /')
          if [ -n "$breaking" ]; then printf '## Breaking changes\n\n%s\n\n' "$breaking" >> notes.md; fi
          section feat Features
          section fix Fixes
          section perf Performance
          section refactor Refactoring
          section docs Documentation
          section test Tests
          section build Build
          section ci CI
          section chore Chores
          other=$( (grep -vE '^(feat|fix|perf|refactor|docs|test|build|ci|chore)(\([^)]*\))?!?: ' commits.txt || true) | sed 's/^/- /')
          if [ -n "$other" ]; then printf '## Other\n\n%s\n\n' "$other" >> notes.md; fi
          if [ -n "$prev" ]; then echo "**Full changelog:** https://github.com/$GITHUB_REPOSITORY/compare/$prev...$VERSION" >> notes.md; fi
          cat notes.md

      - name: Create release
        run: |
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "release $VERSION already exists"
            exit 0
          fi
          gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --target "$MERGE_SHA" --title "$VERSION" --notes-file notes.md \
            dist/bin/*.tar.gz dist/editors/vscode/*.vsix
