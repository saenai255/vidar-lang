name: Docs

# Builds the book (mdBook) on every PR; publishes it to GitHub Pages when main changes.
on:
  pull_request:
    paths: ["docs/**", "scripts/gen-docs.js", "src/**", "tests/errors/**", "tests/errors_pkg/**", "package.json", ".github/workflows/docs.yml"]
  push:
    branches: [main]
    paths: ["docs/**", "scripts/gen-docs.js", "src/**", "tests/errors/**", "tests/errors_pkg/**", "package.json", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  MDBOOK_VERSION: 0.4.40

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/gen-docs.js --check
      - name: Install mdBook
        run: |
          mkdir -p "$RUNNER_TEMP/mdbook"
          curl -fsSL --retry 3 "https://github.com/rust-lang/mdBook/releases/download/v$MDBOOK_VERSION/mdbook-v$MDBOOK_VERSION-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz -C "$RUNNER_TEMP/mdbook"
          echo "$RUNNER_TEMP/mdbook" >> "$GITHUB_PATH"
      # mdBook only logs a failed preprocessor and builds without it, so fail on its log
      - run: mdbook build docs 2>&1 | tee mdbook.log && ! grep -E "ERROR|Error:" mdbook.log
      - run: node scripts/test-docs.js --links
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/book

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
