name: Docs

# Builds the site on every PR; publishes it to GitHub Pages when main changes.
on:
  pull_request:
    paths: ["docs/**", "scripts/gen-docs.js", "src/**", "tests/errors/**", "tests/errors_pkg/**", "editors/vscode/syntaxes/**", "package.json", ".github/workflows/docs.yml"]
  push:
    branches: [main]
    paths: ["docs/**", "scripts/gen-docs.js", "src/**", "tests/errors/**", "tests/errors_pkg/**", "editors/vscode/syntaxes/**", "package.json", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/gen-docs.js --check
      - run: npx vitepress build docs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
